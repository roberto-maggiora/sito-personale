<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roberto Maggiora</title>
<link rel="alternate" hreflang="it" href="it/">
<link rel="alternate" hreflang="en" href="en/">
<link rel="alternate" hreflang="x-default" href="en/">
<script>
  (function () {
    var lang = null;
    try { lang = localStorage.getItem('lang'); } catch (e) {}
    if (lang !== 'it' && lang !== 'en') {
      var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
      lang = 'en';
      for (var i = 0; i < prefs.length; i++) {
        var p = String(prefs[i]).toLowerCase().slice(0, 2);
        if (p === 'it') { lang = 'it'; break; }
        if (p === 'en') { break; }
      }
    }
    location.replace(lang + '/' + location.hash);
  })();
</script>
<style>body{font-family:system-ui,sans-serif;display:grid;place-content:center;height:100vh;margin:0;text-align:center}a{margin:0 .6rem}</style>
</head>
<body>
<noscript><p><a href="it/">Italiano</a> · <a href="en/">English</a></p></noscript>
</body>
</html>
